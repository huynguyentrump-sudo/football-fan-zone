<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tin tức – Football Fan Zone</title>
<meta name="description" content="Football Fan Zone – tin tức, lịch thi đấu, cộng đồng và quiz dành cho người yêu bóng đá.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">

<body>
<main class="container">
  <div id="newsListView">
    <h1 class="page-title">Tin tức<small>Tin bóng đá mới và nổi bật</small></h1>
    <div class="toolbar">
      <div class="chips" id="newsFilters"></div>
      <input id="newsSearch" type="search" placeholder="🔍 Tìm tin (VD: Arsenal)">
    </div>
    <div class="news-list" id="newsList"></div>
  </div>
  <article class="article card hidden" id="articleView"></article>

<script src="data.js"></script>
<script src="common.js"></script>
<script src="news.js"></script>
